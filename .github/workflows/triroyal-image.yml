name: triroyal-image

# Builds the Triroyal image (upstream release + local patches) and pushes it to GHCR.
# Every push to the triroyal branch builds ghcr.io/triroyal/open-archiver:v<upstream version>-tr-<short sha>.
on:
    push:
        branches:
            - triroyal
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    image:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Resolve tag
              id: tag
              run: echo "tag=v$(node -p 'require("./package.json").version')-tr-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3

            - name: Build and push
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./apps/open-archiver/Dockerfile
                  platforms: linux/amd64
                  pull: true
                  push: true
                  tags: ghcr.io/triroyal/open-archiver:${{ steps.tag.outputs.tag }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/triroyal/OpenArchiver
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.licenses=AGPL-3.0

            - name: Print image reference for docker-compose.yml
              run: echo "ghcr.io/triroyal/open-archiver:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
